# CI/CD Quality Gates — copy to .github/workflows/ci.yml
# (GitHub App cannot push workflow files; add via web UI)
name: Quality Gates

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run evaluator unit tests
        run: python -m pytest tests/ -q

      - name: Evaluate gates (PASS sample)
        run: python scripts/evaluate_gates.py sample-data/metrics.json --junit reports/junit-pass.xml || true

      - name: Evaluate gates (WARN sample)
        run: python scripts/evaluate_gates.py sample-data/metrics.json sample-data/integration-suite-report-warn.json --junit reports/junit-warn.xml || true

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-reports
          path: reports/
